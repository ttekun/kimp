name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
      - run: pnpm format:check
      - run: pnpm --filter @kimchi/web exec playwright install --with-deps chromium
      - run: pnpm --filter @kimchi/web test:e2e
      - name: GitHub Pages subpath smoke
        env:
          GITHUB_PAGES: 'true'
        run: |
          pnpm --filter @kimchi/web build
          pnpm --filter @kimchi/web exec playwright test --config playwright.pages.config.ts
