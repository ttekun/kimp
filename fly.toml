# fly.toml app name is chosen at `fly launch`. This file is the intended production shape.
# Region nrt (Tokyo) is closest to Upbit/Bitbank; Binance is global anycast.

app = 'kimp'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  ENABLE_HSTS = '1'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
